name: CI & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # chickensoft/setup-godot does not support Godot 3.x — install official headless binary
      - name: Install Godot 3.5.3
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
          unzip -q godot.zip
          sudo install -m 755 Godot_v3.5.3-stable_linux_headless.64 /usr/local/bin/godot
          godot --version

      - name: Run CI analysis
        run: |
          godot --no-window -s tests/ci_test.gd -- \
            --project-path . \
            --output ci_report.json \
            --csv-output ci_report.csv

      - name: Verify fixtures
        run: godot --no-window -s tests/verify_cc_cog.gd

      - name: Edge cases
        run: godot --no-window -s tests/test_edge_cases.gd

      - name: Validate confidence gate
        run: godot --no-window -s tests/validate_confidence.gd -- \
          --min-r2 0.70 \
          --metrics-out ci_metrics.json

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-godot3
          path: |
            ci_report.json
            ci_report.csv
            ci_metrics.json
          if-no-files-found: ignore

  release:
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release
        run: |
          mkdir -p dist
          zip -r dist/gdmetrics-${{ github.ref_name }}.zip \
            addons/gdscript_complexity \
            docs \
            README.md \
            LICENSE \
            complexity_config.example.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gdmetrics-${{ github.ref_name }}.zip
          body_path: release/NOTES.md
          fail_on_unmatched_files: false
